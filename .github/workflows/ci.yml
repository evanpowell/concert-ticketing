name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests (real Oracle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The integration tests start Oracle via Testcontainers. Pulling it as an
      # explicit step keeps the several-minute image download out of the test
      # timing, so a slow pull reads as a slow pull rather than a slow test.
      - name: Pull Oracle image
        run: docker pull gvenzl/oracle-free:23-slim-faststart

      - name: Test
        run: dotnet test api/Ticketing.slnx --logger "console;verbosity=normal"

  web:
    name: Web build and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  image:
    name: Build and publish image
    needs: [api, web]
    if: github.ref == 'refs/heads/main'
    # Arm runner so the image is built natively for the Ampere A1 target,
    # with no QEMU emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # The default buildx driver ("docker") cannot export a cache, which fails
      # with "Cache export is not supported for the docker driver". This sets up
      # the docker-container driver, which can.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ticketing-api:latest
            ghcr.io/${{ github.repository_owner }}/ticketing-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Pull the new image and restart the API
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            ubuntu@"$SERVER_IP" \
            'cd /opt/ticketing && docker compose -f compose.prod.yaml pull api && docker compose -f compose.prod.yaml up -d api'

      # Without this a deploy that starts a broken container still reports green.
      - name: Verify the deployment is healthy
        run: |
          for i in $(seq 1 30); do
            body=$(curl -sf --max-time 10 "${{ vars.PUBLIC_URL }}/health" || true)
            case "$body" in
              *'"database":true'*) echo "healthy: $body"; exit 0 ;;
            esac
            sleep 5
          done
          echo "deployment did not become healthy"
          exit 1
